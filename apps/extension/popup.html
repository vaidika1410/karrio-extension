<!DOCTYPE html>
<html>

<head>
  <title>Karrio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 360px;
      margin: 0;
      padding: 16px;

      background: #0f172a;
      color: white;

      font-family:
        Inter,
        Arial,
        sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 13px;
    }

    .card {
      background: #111827;

      border: 1px solid #1e293b;

      border-radius: 16px;

      padding: 16px;

      display: flex;
      flex-direction: column;

      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .label {
      font-size: 12px;
      color: #94a3b8;
    }

    input {
      width: 100%;

      border: 1px solid #1e293b;

      background: #0f172a;

      color: white;

      padding: 12px;

      border-radius: 12px;

      outline: none;

      font-size: 14px;
    }

    input:focus {
      border-color: #6366f1;
    }

    button {
      border: none;

      background: #6366f1;

      color: white;

      padding: 14px;

      border-radius: 12px;

      cursor: pointer;

      font-weight: 600;

      font-size: 14px;

      transition: 0.2s;
    }

    button:hover {
      background: #5855eb;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.75;
    }

    .footer {
      text-align: center;

      font-size: 12px;

      color: #64748b;
    }

    .status {
      font-size: 12px;
      font-weight: 500;
    }

    .status.success {
      color: #22c55e;
    }

    .status.error {
      color: #ef4444;
    }

    .auth-status {
      font-size: 12px;
      line-height: 1.4;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      background: #0f172a;
    }

    .auth-status.connected {
      color: #22c55e;
      border-color: rgba(34, 197, 94, 0.25);
      background: rgba(34, 197, 94, 0.08);
    }

    .auth-status.disconnected {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.25);
      background: rgba(251, 191, 36, 0.08);
    }

    .auth-status.checking {
      color: #94a3b8;
    }

    .auth-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      background: transparent;
      cursor: pointer;
    }

    .link-button:hover {
      background: #1e293b;
    }


    textarea {
      width: 100%;

      border: 1px solid #1e293b;

      background: #0f172a;

      color: white;

      padding: 12px;

      border-radius: 12px;

      outline: none;

      font-size: 14px;

      resize: vertical;

      min-height: 80px;

      font-family: inherit;
    }

    textarea:focus {
      border-color: #6366f1;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="title">
        Karrio
      </div>

      <div class="subtitle">
        Save jobs instantly
      </div>
    </div>

    <div class="card">
      <div class="field">
        <div class="label">
          Job Role
        </div>

        <input id="role" placeholder="Frontend Engineer" />
      </div>

      <div class="field">
        <div class="label">
          Company
        </div>

        <input id="company" placeholder="Google" />
      </div>

      <div class="field">
        <div class="label">
          Account
        </div>

        <div id="authStatus" class="auth-status checking">
          Checking Karrio sign-in...
        </div>

        <div class="auth-actions">
          <a id="openKarrio" class="link-button" href="http://localhost:3001/login">
            Open Karrio
          </a>
          <button id="refreshAuth" type="button" class="link-button">
            Refresh sign-in
          </button>
        </div>
      </div>

      <div class="field">
        <div class="label">
          Notes
        </div>

        <textarea id="notes" placeholder="Optional notes..."></textarea>
      </div>

      <button id="saveJob">
        Save to Karrio
      </button>

      <div id="status" class="status"></div>
    </div>

    <div class="footer">
      Karrio Extension MVP
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
